<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Sono", sans-serif;
        background-color: #f5f5f5;
        padding: 40px 20px;
        min-height: 100vh;
      }

      .pricing-container {
        display: flex;
        justify-content: center;
        gap: 30px;
        flex-wrap: wrap;
        max-width: 1400px;
        margin: 0 auto;
      }

      .pricing-plan {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #e8e8e8;
        padding: 40px 30px;
        border-radius: 8px;
        width: 300px;
        gap: 20px;
      }

      .plan-title {
        font-size: 24px;
        font-weight: 700;
        text-align: center;
      }

      .plan-price {
        font-size: 48px;
        font-weight: 700;
        text-align: center;
      }

      .plan-features {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 12px;
        text-align: center;
        flex-grow: 1;
      }

      .plan-features li {
        font-size: 16px;
      }

      .plan-button {
        background-color: #ff6633;
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: 700;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .plan-button:hover {
        background-color: #ff5511;
      }

      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container {
          flex-direction: column;
          align-items: center;
        }

        .pricing-plan {
          width: 100%;
          max-width: 500px;
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$11.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
